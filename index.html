<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };

        let bufferedDirection = null;

        document.addEventListener("keydown", (event) => {

            switch (event.key.toLowerCase()) {
                case "w":
                case "arrowup":
                    if (direction.y === 0) bufferedDirection = { x: 0, y: -1 };
                   
                    break;
                case "s":
                case "arrowdown":
                    if (direction.y === 0) bufferedDirection = { x: 0, y: 1 };
                    swapped = true;
                    break;
                case "a":
                case "arrowleft":
                    if (direction.x === 0) bufferedDirection = { x: -1, y: 0 };
                    swapped = true;
                    break;
                case "d":
                case "arrowright":
                    if (direction.x === 0) bufferedDirection = { x: 1, y: 0 };
                    swapped = true;
                    break;
            }
        });

        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {

            if (bufferedDirection) {
                direction = bufferedDirection;
                bufferedDirection = null;
            }

            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }

        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)

        function moveSnake() {
            const head = snake[0];
            const newHead = { x: head.x + direction.x, y: head.y + direction.y };
            snake.unshift(newHead);

            if (newHead.x === food.x && newHead.y === food.y) {
                score ++;

                let newFood;
                do {
                    newFood = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
                } while (snake.some(part => part.x === newFood.x && part.y === newFood.y));
                food = newFood;

            } else {
                snake.pop();
            }
            
            drawGame();
        }
        setInterval(moveSnake, 150);

        // Step 2: Keyboard controls (arrow keys)

        

        // Step 3: Eating and growing



        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
