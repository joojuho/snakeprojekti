<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        const info = document.getElementById("info");

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };

        let gameTimer = null;
        let defaultSpeed = 150;
        let currentSpeed = defaultSpeed;
        let minSpeed = 50;
        let speedIncrement = 5;

        let bufferedDirection = null;

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            bufferedDirection = null;
            food = { x: 15, y: 15 };
            score = 0;
            currentSpeed = defaultSpeed;
            clearInterval(gameTimer);
            gameTimer = setInterval(moveSnake, currentSpeed);
            gameOver = false;
        }

        document.addEventListener("keydown", (event) => {

            switch (event.key.toLowerCase()) {
                case "w":
                case "arrowup":
                    if (direction.y === 0) bufferedDirection = { x: 0, y: -1 };
                   
                    break;
                case "s":
                case "arrowdown":
                    if (direction.y === 0) bufferedDirection = { x: 0, y: 1 };
                    break;
                case "a":
                case "arrowleft":
                    if (direction.x === 0) bufferedDirection = { x: -1, y: 0 };
                    break;
                case "d":
                case "arrowright":
                    if (direction.x === 0) bufferedDirection = { x: 1, y: 0 };
                    break;
                case "r":
                    resetGame();
                    break;
            }
        });

        let food = { x: 15, y: 15 };
        let score = 0;
        let gameOver = false;

        // ===== DRAWING =====
        const drawGame = () => {

            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "#22c55e";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }

            info.textContent = `Score: ${score}`;

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                ctx.fillText("Game Over", centerX, centerY - 30);
                ctx.fillText("Press R to Restart", centerX, centerY);
                ctx.fillText(`Final Score: ${score}`, centerX, centerY + 30);
            }

        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)

        function moveSnake() {

             if (gameOver) return;

            if (bufferedDirection) {
                direction = bufferedDirection;
                bufferedDirection = null;
            }

            const head = snake[0];
            const newHead = { x: head.x + direction.x, y: head.y + direction.y };

           

            if (newHead.x < 0 || newHead.x >= tileCount || newHead.y < 0 || newHead.y >= tileCount || snake.some(part => part.x === newHead.x && part.y === newHead.y)) {
                gameOver = true;
                drawGame();
                return;
            }

            snake.unshift(newHead);

            

            if (newHead.x === food.x && newHead.y === food.y) {
                score ++;

                let newFood;
                do {
                    newFood = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
                } while (snake.some(part => part.x === newFood.x && part.y === newFood.y));
                food = newFood;

                if (currentSpeed > minSpeed) {
                    currentSpeed -= speedIncrement;
                    clearInterval(gameTimer);
                    gameTimer = setInterval(moveSnake, currentSpeed);
                }

            } else {
                snake.pop();
            }
            
            drawGame();
        }

       

        gameTimer = setInterval(moveSnake, defaultSpeed);


        // Step 2: Keyboard controls (arrow keys)

        

        // Step 3: Eating and growing



        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
